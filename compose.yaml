services:
  vikunja:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: vikunja-local:latest
    restart: unless-stopped
    ports:
      - "${VIKUNJA_BIND_ADDRESS:-0.0.0.0}:${VIKUNJA_PORT:-3456}:3456"
    env_file:
      - .env.docker
    environment:
      VIKUNJA_SERVICE_PUBLICURL: "${VIKUNJA_PUBLIC_URL:-https://projetos.vctor.qzz.io/}"
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - vikunja-data:/data

volumes:
  vikunja-data:
